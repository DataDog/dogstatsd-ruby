name: Publish

on: workflow_dispatch

permissions: {}

concurrency: publish

jobs:
  publish:
    name: Build and push gem to RubyGems.org
    if: github.repository == 'DataDog/dogstatsd-ruby' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    environment: rubygems.org
    permissions:
      contents: read
      id-token: write # RubyGems trusted publishing and Octo STS
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Set up Ruby
        uses: ruby/setup-ruby@afeafc3d1ab54a631816aba4c914a0081c12ff2f # v1.310.0
        with:
          ruby-version: '3.4'
          bundler-cache: true
      - name: Run tests
        run: bundle exec rake spec
      - uses: DataDog/dd-octo-sts-action@96a25462dbcb10ebf0bfd6e2ccc917d2ab235b9a # v1.0.4
        id: octo-sts
        with:
          scope: DataDog/dogstatsd-ruby
          policy: self.publish
      - uses: rubygems/release-gem@6317d8d1f7e28c24d28f6eff169ea854948bd9f7 # v1.2.0
        with:
          token: ${{ steps.octo-sts.outputs.token }}
