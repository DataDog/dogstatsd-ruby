name: Ruby Test

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

permissions:
  contents: read

jobs:
  test:
    name: Ruby ${{ matrix.ruby }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        ruby: ['2.1', '2.2', '2.3', '2.4', '2.5', '2.6', '2.7', '3.0', '3.1', '3.2', '3.3', '3.4', '4.0']
        exclude:
          # CRuby < 2.6 does not support macos-arm64.
          - { os: macos-latest, ruby: '2.1' }
          - { os: macos-latest, ruby: '2.2' }
          - { os: macos-latest, ruby: '2.3' }
          - { os: macos-latest, ruby: '2.4' }
          - { os: macos-latest, ruby: '2.5' }
          # ubuntu-latest is ubuntu-26.04, which has no builds of CRuby < 2.3.
          - { os: ubuntu-latest, ruby: '2.1' }
          - { os: ubuntu-latest, ruby: '2.2' }
        include:
          - { os: ubuntu-24.04, ruby: '2.1' }
          - { os: ubuntu-24.04, ruby: '2.2' }

    steps:
      - name: Checkout repo
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0

      - name: Set up Ruby
        uses: ruby/setup-ruby@b3aaceaef7e0ee231b499e7b5f49c03fc1d32199 # v1.338.0
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true

      - name: Run tests
        run: bundle exec rake spec
