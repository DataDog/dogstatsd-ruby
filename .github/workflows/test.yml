name: Ruby Test

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

permissions:
  contents: read

jobs:
  test:
    name: Ruby ${{ matrix.ruby }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-26.04, macos-latest, windows-latest]
        ruby: ['2.1', '2.2', '2.3', '2.4', '2.5', '2.6', '2.7', '3.0', '3.1', '3.2', '3.3', '3.4', '4.0']
        exclude:
          # Ruby 2.1 and 2.2 only have prebuilt binaries for ubuntu-22.04/24.04,
          # not ubuntu-26.04.
          - { os: ubuntu-26.04, ruby: '2.1' }
          - { os: ubuntu-26.04, ruby: '2.2' }
          # All other rubies have ubuntu-26.04 binaries; don't also run them
          # on ubuntu-22.04.
          - { os: ubuntu-22.04, ruby: '2.3' }
          - { os: ubuntu-22.04, ruby: '2.4' }
          - { os: ubuntu-22.04, ruby: '2.5' }
          - { os: ubuntu-22.04, ruby: '2.6' }
          - { os: ubuntu-22.04, ruby: '2.7' }
          - { os: ubuntu-22.04, ruby: '3.0' }
          - { os: ubuntu-22.04, ruby: '3.1' }
          - { os: ubuntu-22.04, ruby: '3.2' }
          - { os: ubuntu-22.04, ruby: '3.3' }
          - { os: ubuntu-22.04, ruby: '3.4' }
          - { os: ubuntu-22.04, ruby: '4.0' }
          # CRuby < 2.6 does not support macos-arm64.
          - { os: macos-latest, ruby: '2.1' }
          - { os: macos-latest, ruby: '2.2' }
          - { os: macos-latest, ruby: '2.3' }
          - { os: macos-latest, ruby: '2.4' }
          - { os: macos-latest, ruby: '2.5' }

    steps:
      - name: Checkout repo
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0

      - name: Set up Ruby
        uses: ruby/setup-ruby@7f797815d8adceb1c412e7abefdd1ab4abc47a5f # v1.335.0
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true

      - name: Run tests
        run: bundle exec rake spec
